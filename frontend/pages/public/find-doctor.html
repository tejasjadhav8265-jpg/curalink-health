<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a doctor | CuraLink Health</title>
  <meta name="description" content="Search doctors by name, specialty, location, fee and availability.">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/polish.css">
</head>
<body>
  <noscript><div class="noscript-note">This website needs JavaScript. Please switch it on in your browser to use it.</div></noscript>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>
  <main id="main">
    <div class="container-xxl">
      <div class="page-head">
        <h1>Find a doctor</h1>
        <p class="text-muted">Search by name, specialty, department or condition, then narrow the results with filters.</p>
      </div>

      <div class="find-layout">
        <aside>
          <button class="btn btn-ghost w-100 d-lg-none mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#filters-panel" aria-expanded="false" aria-controls="filters-panel">
            <i class="fa-solid fa-sliders me-2" aria-hidden="true"></i>Filters
          </button>
          <div class="collapse d-lg-block" id="filters-panel">
            <form class="filters" id="filter-form" role="search" novalidate>
              <h2 class="filter-title">Search and filter</h2>
              <div class="field">
                <label for="q">Name, specialty or condition</label>
                <input class="form-control" id="q" name="q" maxlength="100" placeholder="For example: cardiologist" autocomplete="off">
              </div>
              <div class="field"><label for="department">Department</label><select class="form-select" id="department" name="department"><option value="">All departments</option></select></div>
              <div class="field"><label for="location">Location</label><select class="form-select" id="location" name="location"><option value="">All locations</option></select></div>
              <div class="field"><label for="branch">Hospital branch</label><select class="form-select" id="branch" name="branch"><option value="">All branches</option></select></div>
              <div class="field">
                <span class="d-block fw-semibold small mb-1" id="avail-label">Availability</span>
                <div class="radio-row" role="radiogroup" aria-labelledby="avail-label">
                  <label class="radio-pill"><input type="radio" name="availableOn" value="" checked><span>Any day</span></label>
                  <label class="radio-pill"><input type="radio" name="availableOn" value="today"><span>Today</span></label>
                  <label class="radio-pill"><input type="radio" name="availableOn" value="tomorrow"><span>Tomorrow</span></label>
                </div>
              </div>
              <div class="field"><label for="date">Or pick a date</label><input class="form-control" type="date" id="date" name="date"></div>
              <div class="field"><label for="consultationType">Consultation type</label>
                <select class="form-select" id="consultationType" name="consultationType"><option value="">Any</option><option value="in-person">In-person</option><option value="video">Video</option></select></div>
              <div class="field"><label for="gender">Doctor's gender</label>
                <select class="form-select" id="gender" name="gender"><option value="">Any</option><option value="female">Female</option><option value="male">Male</option></select></div>
              <div class="field"><label for="language">Language</label><select class="form-select" id="language" name="language"><option value="">Any</option></select></div>
              <div class="field"><label for="minExperience">Experience</label>
                <select class="form-select" id="minExperience" name="minExperience"><option value="">Any</option><option value="5">5+ years</option><option value="10">10+ years</option><option value="15">15+ years</option><option value="20">20+ years</option></select></div>
              <div class="field"><label for="maxFee">Maximum fee</label>
                <select class="form-select" id="maxFee" name="maxFee"><option value="">Any</option><option value="400">Up to &#8377;400</option><option value="600">Up to &#8377;600</option><option value="800">Up to &#8377;800</option><option value="1000">Up to &#8377;1,000</option></select></div>
              <div class="field"><label for="minRating">Rating</label>
                <select class="form-select" id="minRating" name="minRating"><option value="">Any</option><option value="4.5">4.5 and above</option><option value="4">4.0 and above</option><option value="3.5">3.5 and above</option></select></div>
              <button class="btn btn-ghost w-100" type="button" id="reset-btn">Clear all filters</button>
            </form>
          </div>
        </aside>

        <section aria-labelledby="results-h">
          <div class="results-bar">
            <h2 class="h5 mb-0" id="results-h" role="status" aria-live="polite">Loading doctors...</h2>
            <div class="d-flex align-items-center gap-2">
              <label for="sort" class="small text-muted mb-0">Sort by</label>
              <select class="form-select form-select-sm" id="sort" name="sort" form="filter-form" style="width:auto">
                <option value="rating">Highest rated</option><option value="experience">Most experienced</option>
                <option value="fee_asc">Fee: low to high</option><option value="fee_desc">Fee: high to low</option><option value="name">Name A to Z</option>
              </select>
            </div>
          </div>
          <div class="active-filters" id="active-filters"></div>
          <div class="doc-list" id="results" aria-busy="true"></div>
          <nav class="pager" id="pager" aria-label="Pages of results"></nav>
        </section>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/find-doctor.js"></script>
</body>
</html>
