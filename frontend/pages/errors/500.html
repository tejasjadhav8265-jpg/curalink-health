  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

<body data-code="500">
  <noscript><div class="noscript-note">This website needs JavaScript. Please switch it on in your browser to use it.</div></noscript>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>
  <main id="main">
    <div class="container-xxl">
      <section class="error-page">
        <p class="error-code" aria-hidden="true">500</p>
        <h1>Something went wrong on our side</h1>
        <p class="error-text">It is not your fault. Please wait a moment and try again. If it keeps happening, tell us through the contact page.</p>
        <p class="error-path" id="path" hidden></p>
        <div class="error-actions">
          <a class="btn btn-brand" href="/">Go to the home page</a>
          <a class="btn btn-ghost" href="/pages/public/find-doctor.html">Find a doctor</a>
          <button type="button" class="btn btn-ghost" id="back">Go back</button>
          <a class="btn btn-ghost" href="/pages/public/contact.html">Contact us</a>
        </div>
        <div class="prose-note mt-4">In an emergency do not wait for this page. Call <a href="tel:112">112</a> or <a href="tel:108">108</a>.</div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/error-page.js"></script>
